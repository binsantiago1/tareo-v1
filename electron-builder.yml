appId: com.pendientes.app
productName: Pendientes
copyright: Pendientes
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!.claude/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,components.json,README.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Pendientes
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: Pendientes-Instalador-${version}.${ext}
  shortcutName: Pendientes
  uninstallDisplayName: Pendientes
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Al desinstalar NO se borran los datos del usuario (%APPDATA%\Pendientes).
  deleteAppDataOnUninstall: false
  language: '3082'
npmRebuild: false
